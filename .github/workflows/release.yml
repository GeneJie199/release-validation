name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify formatting
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -timeout 180s ./...
      - name: Race detector
        if: matrix.os == 'ubuntu-latest'
        run: go test -race -timeout 240s ./...
      - name: Static analysis
        if: matrix.os == 'ubuntu-latest'
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.7.0 ./...
      - name: Reachable vulnerability scan
        if: matrix.os == 'ubuntu-latest'
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...
      - name: Verify tag is documented
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          grep -q "^## ${version%%-*} " CHANGELOG.md

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: linux, goarch: amd64, ext: "", archive: "tar.gz" }
          - { goos: linux, goarch: arm64, ext: "", archive: "tar.gz" }
          - { goos: darwin, goarch: amd64, ext: "", archive: "tar.gz" }
          - { goos: darwin, goarch: arm64, ext: "", archive: "tar.gz" }
          - { goos: windows, goarch: amd64, ext: ".exe", archive: "zip" }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Build and package
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          BINARY=releaseguard-${GOOS}-${GOARCH}${{ matrix.ext }}
          STAGE=releaseguard-${VERSION}-${GOOS}-${GOARCH}
          go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" -o "${BINARY}" ./cmd/releaseguard
          mkdir "${STAGE}"
          cp "${BINARY}" "${STAGE}/releaseguard${{ matrix.ext }}"
          cp README.md CHANGELOG.md LICENSE SECURITY.md release-plan.example.json "${STAGE}/"
          cp -R deploy docs examples scripts "${STAGE}/"
          if [ "${GOOS}" = windows ]; then
            zip -qr "${STAGE}.zip" "${STAGE}"
          else
            tar -czf "${STAGE}.tar.gz" "${STAGE}"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: releaseguard-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            releaseguard-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}
            releaseguard-*-${{ matrix.goos }}-${{ matrix.goarch }}.${{ matrix.archive }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - run: cd dist && sha256sum releaseguard-* > checksums.txt
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
