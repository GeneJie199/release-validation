name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race -timeout 120s ./...
      - run: go run honnef.co/go/tools/cmd/staticcheck@v0.7.0 ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...
      - run: go build -trimpath -o releaseguard ./cmd/releaseguard
      - name: CLI and installer smoke
        run: |
          ./releaseguard version
          ./releaseguard init --help
          ./releaseguard doctor --help
          ./releaseguard serve --help
          sh -n scripts/install.sh
          test -s internal/web/static/vendor/lucide.min.js
          for path in README.md CHANGELOG.md LICENSE SECURITY.md release-plan.example.json deploy docs examples scripts; do test -e "$path"; done

  platform-test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: go test -timeout 120s ./...
      - run: go vet ./...
      - run: go build -trimpath -o releaseguard ./cmd/releaseguard
      - name: Verify Windows installer syntax
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'scripts/install.ps1'), [ref]$null, [ref]$errors)
          if ($errors.Count) { $errors | Format-List; exit 1 }
